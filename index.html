 ["Tres aspectos para diseñar un algoritmo","Las primitivas de partida, el lenguaje simbólico y la representación de los datos."],
 ["Tipos de acciones de un algoritmo","De entrada, de proceso y de salida."],
 ["¿Qué es la interfaz de un algoritmo?","Acciones de entrada + datos de entrada + acciones de salida + datos de salida."],
 ["Cinco propiedades exigibles a un algoritmo","Corrección, eficiencia, simplicidad, repetitividad y finitud."],
 ["¿Por qué una receta no es un algoritmo?","Porque falla la repetitividad: con los mismos ingredientes no siempre sale lo mismo."],
 ["Fases del ciclo de vida en cascada","Definición (análisis, requisitos), desarrollo (diseño, implementación, verificación) y mantenimiento."],
 ["Inconveniente del modelo en cascada","El cliente no ve el programa hasta casi el final y puede haber que retroceder varias fases."],
 ["Modelo incremental","Combina el lineal con los prototipos: cada incremento se evalúa y sirve para planificar el siguiente."],
 ["¿Qué añade el modelo en espiral?","El análisis de riesgos, junto a la comunicación con el cliente, planificación, ingeniería y evaluación."],
 ["¿Qué es el diseño descendente?","Dividir un problema complejo en subproblemas más simples sucesivamente (divide y vencerás)."],
 ["¿Qué es el refinamiento sucesivo?","El proceso de dividir cada subproblema en subproblemas más simples."],
 ["Tres tipos de notación algorítmica","Textual (pseudolenguaje), gráfica (diagramas de flujo, UML) y ejecutable (lenguajes de programación)."],
 ["MIENTRAS vs REPETIR","MIENTRAS comprueba la condición antes (0 o más veces); REPETIR ejecuta y luego comprueba (1 o más veces)."],
 ["Alto nivel vs bajo nivel","Alto: productivos, poco eficientes, independientes de la máquina. Bajo: eficientes, poco productivos, dependientes."],
 ["Código fuente vs código máquina","Fuente: escrito en un lenguaje, no ejecutable directamente. Máquina: instrucciones en bits ejecutables."],

cortas: [
 {p:"Define algoritmo y enumera las propiedades que debe cumplir.", r:"Un algoritmo es una secuencia ordenada de acciones que resuelve un problema concreto sin ambigüedad y en un tiempo finito. Debe ser correcto (resuelve exactamente el problema), eficiente (tiempo razonable y poca memoria), simple, repetitivo (iguales resultados con iguales entradas) y finito (siempre termina).", k:["Secuencia ordenada, sin ambigüedad, finita","Corrección","Eficiencia","Simplicidad","Repetitividad","Finitud"]},
 {p:"Explica las fases del ciclo de vida lineal o en cascada y su principal inconveniente.", r:"Definición: análisis y especificación de requisitos (qué hace, qué datos, restricciones, recursos, costes, plan). Desarrollo: diseño del algoritmo, implementación en un lenguaje y verificación. Mantenimiento: correcciones, mejoras y adaptaciones. El inconveniente es que el cliente no ve una versión del programa hasta casi el final y puede haber que retroceder varias fases.", k:["Definición","Desarrollo: diseño, implementación, verificación","Mantenimiento","El cliente ve el programa tarde"]},
 {p:"Compara el modelo de prototipos con el incremental.", r:"En el de prototipos el cliente interactúa desde el principio: se le escucha, se construye o revisa una maqueta y el cliente la prueba, aunque los compromisos de las primeras versiones pueden mermar la calidad final. El incremental combina el lineal y los prototipos: cada incremento repite análisis, diseño, implementación y verificación; el primero suele ser un producto esencial que el cliente evalúa y de esa evaluación sale el siguiente incremento.", k:["Maqueta y cliente desde el inicio","Riesgo de calidad","Incremental = lineal + prototipos","Cada incremento evaluado"]},
 {p:"¿En qué consiste el diseño descendente y qué ventajas tiene usar una metodología de diseño?", r:"Es aplicar divide y vencerás: el problema se divide en subproblemas más simples, y estos a su vez (refinamiento sucesivo), hasta que se resuelvan de forma sencilla. Cada subproblema se resuelve con un módulo (programación modular), con un programa principal de mayor jerarquía. Sin metodología los programas son rígidos, se pierde tiempo corrigiendo, no se reutiliza código y la documentación es deficiente.", k:["Divide y vencerás","Refinamiento sucesivo","Módulos y jerarquía","Inconvenientes de no usar metodología"]},
 {p:"Diferencia entre las estructuras MIENTRAS y REPETIR del pseudolenguaje.", r:"MIENTRAS &lt;c&gt; HACER comprueba la condición antes de cada repetición, incluso la primera, y repite mientras sea cierta; puede no ejecutarse nunca. REPETIR … HASTA QUE &lt;c&gt; ejecuta primero la acción y después comprueba la condición, repitiendo hasta que sea cierta; se ejecuta al menos una vez.", k:["Momento de la comprobación","Mientras sea cierta / hasta que sea cierta","0 veces vs al menos 1"]},
 {p:"Explica el proceso de compilación y la diferencia entre compilador e intérprete.", r:"El programador escribe el código fuente con un editor; el compilador lo traduce a código objeto (tiempo de compilación) y el enlazador lo une con las bibliotecas para producir el ejecutable, que el usuario ejecuta (tiempo de ejecución). El compilador traduce el programa entero y genera un ejecutable sin ejecutarlo; el intérprete traduce y ejecuta instrucción a instrucción y hay que traducir en cada ejecución.", k:["Editor, compilador, enlazador","Código objeto y bibliotecas","Compilador genera ejecutable","Intérprete instrucción a instrucción"]}
],

flash: [
 ["¿Quién creó C y dónde?","Dennis Ritchie, en los Laboratorios Bell (1969-1973), como evolución del lenguaje B de Ken Thompson."],
 ["¿Cuándo se estandarizó C?","En 1989, por ANSI e ISO."],
 ["¿Por qué C++ es un lenguaje híbrido?","Permite programar en estilo imperativo (como C) y orientado a objetos (como Java)."],
 ["Cinco características de C","Imperativo y estructurado, flexible y potente, eficiente, portable y compilado."],
 ["¿Qué determina un tipo de datos?","El rango de valores y el conjunto de operaciones posibles."],
 ["Tres integrantes del lenguaje C","El compilador, la librería estándar y el preprocesador."],
 ["¿Impiden los warnings la compilación?","No; solo los errores la impiden."],
 ["¿Cuándo actúa el preprocesador?","Sobre el código fuente, antes de la compilación, mediante directivas que empiezan por #."],
 ["#include &lt;x&gt; vs #include \"x\"","Ángulos: busca en la librería estándar. Comillas: busca en el directorio actual."],
 ["¿Qué devuelve main() al terminar bien?","return 0."],
 ["Cinco tipos de tokens","Identificadores, palabras reservadas, constantes, operadores y separadores."],
 ["Reglas de un identificador","Letras, dígitos y subrayado; no empieza por dígito; distingue mayúsculas y minúsculas."],
 ["Rango de int según los apuntes","2 bytes: [−32.768, 32.767]."],
 ["¿Qué guarda internamente un char?","El valor numérico de su posición en el código ASCII (1 byte)."],
 ["¿Cuánto valen 011 y 0xFF en C?","011 es octal = 9; 0xFF es hexadecimal = 255."],
 ["Tipo por defecto de 3.53 y de 3.53f","3.53 es double; 3.53f es float."],
 ["¿Cómo se declaran las constantes simbólicas?","Con const, en mayúsculas, al principio del programa tras las librerías."],
 ["Promoción vs casting","Promoción: conversión implícita al tipo de mayor rango. Casting: conversión explícita con (tipo)."],
 ["¿Qué hace / con dos enteros?","La división entera, sin decimales."],
 ["Preincremento vs postincremento","++x incrementa y luego usa el valor; x++ usa el valor y luego incrementa."],
 ["Evaluación en cortocircuito","En &amp;&amp; basta un falso para que todo sea falso; en || basta un verdadero para que todo sea verdadero."],
 ["Leyes de Morgan","!(a &amp;&amp; b) ⇔ !a || !b; !(a || b) ⇔ !a &amp;&amp; !b."],
 ["Sentencia simple, compuesta y nula","Simple: termina en ;. Compuesta: varias entre llaves. Nula: un ; solo."],

cortas: [
 {p:"Explica los tres integrantes del lenguaje C.", r:"El compilador traduce a lenguaje máquina los archivos fuente y detecta errores (fatales, de sintaxis) y advertencias, que no impiden compilar. La librería estándar es un conjunto de librerías con código objeto de funciones preprogramadas que viene con el compilador y cubre lo que C no incluye, como la E/S. El preprocesador actúa sobre el fuente antes de compilar mediante directivas que empiezan por # (#include, #define…).", k:["Compilador: traduce y detecta errores","Librería estándar: funciones preprogramadas, E/S","Preprocesador: antes de compilar, directivas #"]},
 {p:"Describe la estructura general de un programa en C/C++ y el papel de main().", r:"Primero las directivas del preprocesador (#include), luego la declaración de tipos, los prototipos de las funciones, la función main() y la definición de las funciones del programador. main() es obligatoria y única: la ejecución empieza por ella, su cuerpo va entre llaves y termina con return 0, que indica que ha acabado correctamente.", k:["Directivas","Tipos y prototipos","main() única y obligatoria","return 0","Definición de funciones"]},

 {p:"Explica la diferencia entre definición, declaración (prototipo) y llamada de una función.", r:"La definición consta de la cabecera (tipo devuelto, nombre y parámetros formales) y el cuerpo con el código y el valor devuelto. La declaración o prototipo es la cabecera terminada en punto y coma: adelanta el número y tipo de parámetros y el tipo devuelto, sin el proceso, para poder llamarla antes de definirla. La llamada invoca la función escribiendo su nombre con los parámetros reales, que deben coincidir en número, orden y tipo compatible con los formales.", k:["Cabecera + cuerpo","Prototipo con ;","Parámetros reales en la llamada","Correspondencia número/orden/tipo"]},
 {p:"Explica los parámetros de entrada, salida y entrada/salida y cómo se pasa cada uno.", r:"De entrada: la llamante pasa un valor que la función solo utiliza; no debe aparecer a la izquierda de una asignación; se pasa por valor. De salida: la función no recibe valor, solo lo devuelve; solo aparece a la izquierda de asignaciones; por referencia. De entrada/salida: se pasa un valor que la función usa y modifica, y el cambio se refleja en el real; por referencia (p. ej. intercambiar).", k:["Entrada por valor","Salida por referencia","E/S por referencia","Regla de la asignación"]},
 {p:"Compara el paso por valor y el paso por referencia (funcionamiento, parámetros reales admitidos, ventajas e inconvenientes).", r:"Por valor se copia el real en el formal y son variables independientes: los cambios no afectan al real; el real puede ser variable, constante o expresión. Evita efectos laterales pero usa más memoria. Por referencia (con &amp; en C++) el formal es otra referencia a la misma variable y los cambios se reflejan; el real solo puede ser una variable. Usa menos memoria y permite devolver varios valores, pero puede producir efectos laterales.", k:["Copia vs referencia","Expresiones vs solo variables","Efectos laterales","Memoria","Varios valores"]},
 {p:"¿Qué son las variables locales y globales y por qué no usamos las globales?", r:"Las locales se declaran en el cuerpo de una función (al principio), se crean al llamarla y se destruyen al terminar; su ámbito es esa función, y los parámetros formales se comportan como locales. Las globales se declaran fuera de toda función, tras el preprocesador, y pueden usarse en cualquier función. Se desaconsejan por los efectos colaterales; toda la información debe llegar a la función por su interfaz. Si coinciden los nombres, prevalece la local.", k:["Ámbito local","Creación y destrucción","Globales fuera de funciones","Efectos colaterales","Prevalece la local"]},
 {p:"¿Por qué definimos las funciones después de main() con prototipos?", r:"Porque con todos los prototipos declarados antes de main() cualquier función puede llamar a cualquier otra sin importar el orden de las definiciones, se evitan problemas de ámbito y es más fácil localizar las características de cada función. Si se definieran antes de main(), cada función tendría que estar definida antes de la que la llama.", k:["Prototipos antes de main","Orden indiferente","Problemas de ámbito","Localizar interfaces"]}
],

   ["Idea","Visitar las posiciones hasta encontrar x o llegar al final.","Mirar el centro m = (izq + der)/2 y descartar la mitad: si v[m] &lt; x, izq = m + 1; si v[m] &gt; x, der = m − 1."],

 {k:"codigo", t:"Búsqueda secuencial y binaria", c:"int busqueda_secuencial(const Tvector &v, int x, int tam) {\n    int ind = 0, pos = -1;\n    while (ind < tam && v[ind] != x)     // cortocircuito: evita salir de rango\n        ind++;\n    if (ind < tam) pos = ind;\n    return pos;\n}\n\nint busqueda_binaria(const Tvector &v, int x, int tam) {\n    int izq = 0, der = tam - 1, m, posicion = -1;\n    while (izq <= der && posicion == -1) {\n        m = (izq + der) / 2;\n        if (v[m] == x) posicion = m;\n        else if (v[m] < x) izq = m + 1;\n        else der = m - 1;\n    }\n    return posicion;\n}"},

 ]},
 {k:"codigo", t:"Ordenación por selección", c:"void intercambia(int &x, int &y) {\n    int aux = x; x = y; y = aux;\n}\n\nvoid ordenacion_por_seleccion(Tvector &v, int tam) {   // v es de E/S\n    int i, j, posmin;\n    for (i = 0; i < tam - 1; i++) {\n        posmin = i;                        // supongo que el menor es el i-ésimo\n        for (j = i + 1; j < tam; j++)\n            if (v[j] < v[posmin]) posmin = j;\n        intercambia(v[i], v[posmin]);\n    }\n}"},

cortas: [
 {p:"Define array y explica sus características en C++ (tamaño, índices, operaciones permitidas).", r:"Es una colección finita de elementos del mismo tipo ordenados por un índice. Con #include &lt;array&gt; se define con typedef array&lt;tipo, TAMAÑO&gt;; el tamaño se fija en compilación con una constante y no cambia (estructura estática). Los índices van de 0 a TAMAÑO − 1 y C++ no comprueba el rango. Se pueden asignar y comparar arrays completos, pero la lectura y escritura se hacen elemento a elemento. Tiene los métodos size() y fill().", k:["Finita y homogénea","Tamaño estático","Índices 0..N−1","Sin control de rango","Asignación sí, E/S elemento a elemento"]},
 {p:"¿Cómo se pasan los arrays y registros a las funciones según el uso del parámetro? Justifícalo.", r:"Como parámetros de entrada se pasan por referencia constante (const &amp;): por referencia para no copiar una gran cantidad de memoria y const para que la función no pueda modificarlos. Como parámetros de salida o de entrada/salida se pasan por referencia con &amp;, igual que los tipos simples. Además, una función puede devolver un array o un registro como valor de retorno. Con arrays se pasa también el tamaño real, que puede ser menor que el máximo.", k:["Entrada: const &","Ahorro de memoria","Salida y E/S: &","Retorno","Tamaño real"]},
 {p:"Explica las diferencias entre leer una cadena con cin y con getline y el problema del buffer.", r:"cin &gt;&gt; s lee hasta el primer separador (espacio, tabulador o intro), así que con «buenos días» solo guarda «buenos»; getline(cin, s) lee hasta el retorno de carro y guarda toda la línea. cin deja el separador en el buffer y getline no deja el terminador, por lo que un getline justo después de un cin puede leer ese separador y obtener una cadena vacía. Se soluciona con cin.ignore() o cin.ignore(m, '\\n').", k:["cin hasta separador","getline hasta intro","Separador en el buffer","cin.ignore()"]},
 {p:"Define registro y explica qué operaciones se pueden y no se pueden hacer con ellos.", r:"Un registro (struct) es una colección finita y heterogénea de elementos llamados campos, cada uno con su nombre y de cualquier tipo definido previamente. Se declara con typedef struct { … } Tnombre; se puede inicializar en el orden de los campos y se accede con el operador punto. Se pueden asignar registros del mismo tipo (copia campo a campo), pero no se pueden comparar con operadores relacionales ni leer o escribir directamente: hay que hacerlo campo a campo.", k:["Heterogénea con campos","typedef struct","Operador punto","Asignación sí","Comparación y E/S no"]},
 {p:"Compara la búsqueda secuencial y la binaria.", r:"La secuencial recorre las posiciones hasta encontrar el elemento o llegar al final; no exige ninguna organización de los datos y hace 1 comparación en el mejor caso, N en el peor y N/2 de media. La binaria exige el array ordenado: compara con el central m = (izq + der)/2 y descarta la mitad (izq = m + 1 si v[m] &lt; x, der = m − 1 si v[m] &gt; x); en el peor caso hace trunc(log<sub>2</sub> N) + 1 comparaciones. Ambas devuelven el índice o −1.", k:["Secuencial sin requisitos","Binaria con array ordenado","Comparaciones N vs log2 N","Devuelven −1"]},
 {p:"Explica el algoritmo de ordenación por selección.", r:"En cada pasada i (de 0 a tam − 2) se supone que el menor es v[i], se busca la posición del menor elemento entre i y tam − 1 y se intercambia con v[i]. Así, tras cada pasada, los i + 1 primeros elementos están ordenados en su posición definitiva. Es un algoritmo directo de complejidad N<sup>2</sup>, como la inserción y la burbuja; Quicksort es más eficiente (N·log<sub>2</sub> N).", k:["Buscar el menor","Intercambiar con v[i]","tam − 1 pasadas","Complejidad N²"]}
],

 {p:"Búsqueda binaria de x = 12 en <code>0 2 7 11 18 21 23 37 45 61</code> (tam = 10). ¿Cuántas iteraciones hace el bucle antes de concluir que no está?", r:4, dec:0, pasos:["izq = 0, der = 9 → m = 4: v[4] = 18 &gt; 12 → der = 3.","m = 1: v[1] = 2 &lt; 12 → izq = 2.","m = 2: v[2] = 7 &lt; 12 → izq = 3.","m = 3: v[3] = 11 &lt; 12 → izq = 4. Ahora izq &gt; der: <b>4 iteraciones</b>, devuelve −1."]},

 {p:"¿Cuántas veces aparece la letra 'n' en «En un lugar de la mancha» con el programa del tema?", r:3, dec:0, pasos:["Recorre texto[i] hasta '\\0' contando los que valen 'n'.","«En» (1), «un» (2), «mancha» (3); la E mayúscula no cuenta.","Resultado: <b>3</b>."]},
 {p:"¿Qué escribe?"+COD("typedef array<int, 5> Tv;\nTv v = {{3, 8, 1, 9, 4}};\nint s = 0;\nfor (int i = 0; i < v.size(); i++)\n    if (v[i] > 3) s += v[i];\ncout << s;"), r:21, dec:0, pasos:["Se suman los elementos mayores que 3.","8 + 9 + 4 = <b>21</b>."]},
 {p:"Un array de short (2 bytes) empieza en la dirección 1005<sub>(16</sub>. ¿En qué dirección empieza el elemento [3]?", rs:"100B", u:"(16", pasos:["Dirección de v[i] = inicio + i · tamaño del elemento.","1005<sub>(16</sub> + 3 · 2 = 1005 + 6 = <b>100B<sub>(16</sub></b>."]},
 {p:"¿Qué escribe?"+COD("typedef struct { int num, den; } Tfrac;\nTfrac a = {3, 4}, b = {2, 5}, c;\nc.num = a.num * b.den + b.num * a.den;\nc.den = a.den * b.den;\ncout << c.num;"), r:23, dec:0, pasos:["Suma de fracciones: 3/4 + 2/5.","num = 3·5 + 2·4 = 15 + 8 = <b>23</b>; den = 20."]},
 {p:"Escribe una función que devuelva el mayor elemento de un vector de tam elementos.", pasos:["int mayor_elemento(const Tvector &amp;v, int tam) {","    int max = v[0], i;","    for (i = 1; i &lt; tam; i++) if (v[i] &gt; max) max = v[i];","    return max;","}","El vector es de entrada: se pasa por referencia constante."]},
 {p:"Escribe una función que calcule el producto escalar de dos vectores de tam elementos.", pasos:["int prod_esc(const Tvector &amp;v1, const Tvector &amp;v2, int tam) {","    int i, s = 0;","    for (i = 0; i &lt; tam; i++) s += v1[i] * v2[i];","    return s;","}"]},
 {p:"Escribe una función que sustituya por asteriscos todas las palabras de longitud m de una frase (versión que modifica la cadena por referencia).", pasos:["void cambia_a_asteriscos(string &amp;s, unsigned m) {","    unsigned i = 0, ini, j;","    while (i &lt; s.size()) {","        while (i &lt; s.size() &amp;&amp; s[i] == ' ') i++;      // salta espacios","        ini = i;","        while (i &lt; s.size() &amp;&amp; s[i] != ' ') i++;      // recorre la palabra","        if (i - ini == m) for (j = ini; j &lt; i; j++) s[j] = '*';","    }","}","Versión 2: string cambia_a_asteriscos(string s, unsigned m) con el mismo cuerpo y return s;"]},
 {p:"Define un registro para fracciones y una función que la simplifique por referencia usando el MCD.", pasos:["typedef struct { unsigned num, den; } Tfraccion;","unsigned mcd(unsigned a, unsigned b) { while (a != b) if (a &gt; b) a -= b; else b -= a; return a; }","void simplificar(Tfraccion &amp;f) { unsigned d = mcd(f.num, f.den); f.num /= d; f.den /= d; }","La fracción es de entrada/salida: se pasa por referencia."]}
]
